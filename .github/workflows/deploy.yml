name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check A2UI notebook parity
        run: python -m unittest discover -s tests -p 'test_a2ui_notebooks.py'
      - name: Install Mamba and Xeus build dependencies
        uses: mamba-org/setup-micromamba@v1
        with:
          micromamba-version: '1.5.8-0'
          environment-file: .github/build-environment.yml
          cache-environment: true
      - name: Build the JupyterLite site
        shell: bash -l {0}
        run: |
          python -m pip install -r requirements.txt
          mkdir -p build/runtime-wheels/rpds-py
          python -m zipfile -e wheels/rpds_py-0.30.0-cp313-cp313-emscripten_4_0_9_wasm32.whl build/runtime-wheels/rpds-py
          jupyter lite build --contents content --output-dir dist --piplite-wheels wheels \
            --PyodideAddon.pyodide_url=https://github.com/pyodide/pyodide/releases/download/0.29.3/pyodide-0.29.3.tar.bz2 \
            --XeusAddon.mounts=wheels:/wheels \
            --XeusAddon.mounts=build/runtime-wheels/rpds-py/rpds:/lib/python3.13/site-packages/rpds \
            --XeusAddon.mounts=build/runtime-wheels/rpds-py/rpds_py-0.30.0.dist-info:/lib/python3.13/site-packages/rpds_py-0.30.0.dist-info \
            --XeusAddon.mounts=startup/a2ui_preload.pth:/lib/python3.13/site-packages
      - name: Check Pages preconditions
        env:
          PAGES_DIST: dist
        run: |
          python -m unittest discover -s tests -p 'test_pages_config.py'
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
